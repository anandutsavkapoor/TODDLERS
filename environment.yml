# environment.yml
name: toddlers
channels:
  - conda-forge

dependencies:
  # Core Python (pyproject.toml: requires-python >= 3.10)
  - python=3.11

  # Main dependencies (no version pins; see README)
  - numpy
  - scipy
  - astropy
  - matplotlib
  - pandas
  - h5py
  - requests
  - tqdm
  - psutil
  - gdown
  - zstandard

  # Development dependencies
  - pip
  - ipython
  - jupyter
  - pytest
  - pytest-cov
  - flake8
  - black

  # Optional: PTS (Python Toolkit for SKIRT) - install separately if needed
  # pip install pts
